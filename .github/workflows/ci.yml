name: CI

# Everything here is also run locally before a push (`npm run check:ci`, see CONTRIBUTING.md), so a red
# run should be rare. The three operating systems run side by side; they are the only reason this
# workflow has more than one job, because the guard and filter tests run the built programs and the
# platforms differ in paths, links and case.

on:
  push:
    branches: [main]
    # Nothing in these changes what the tests run. The pre-commit hook checks their formatting.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise run for six hours. A healthy run takes a few minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      # These do not depend on the operating system, so they run once, on the cheapest runner.
      - name: Format
        if: runner.os == 'Linux'
        run: npm run format:check
      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint
      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck
      - name: Dependency audit (what ships)
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      # Builds first (the `pretest` script), then the unit and integration tests, which include
      # `offlimits test` run against the built guard and filter.
      - name: Build and test
        run: npm test
